<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yahu en el bosque</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#9ac7c0 0%, #c1d7ad 55%, #496b3c 100%); }
  canvas { display: block; width: 100%; height: 100%; }
  #error {
    display: none; position: fixed; left: 12px; right: 12px; bottom: 12px;
    padding: 10px 14px; border-radius: 8px; background: #fff; color: #222;
    font: 14px system-ui, sans-serif;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="error">No se pudo cargar la librería 3D. Revisa tu conexión a internet y abre el archivo con Live Server en Visual Studio Code.</div>


<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9cfc1);
scene.fog = new THREE.Fog(0xa9cfc1, 14, 32);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.3, -5.8);
camera.lookAt(0, 0.45, 4.5);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xe8f6ff, 0x52613b, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-4, 8, -3);
sun.castShadow = true;
scene.add(sun);

const mat = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, flatShading: true });
const white = mat(0xf2f2f2);
const pink = mat(0xf2bfd9);
const darkPink = mat(0xb33366);
const purple = mat(0x801a40);
const trunkMat = mat(0x62402b);
const leaf1 = mat(0x397343);
const leaf2 = mat(0x285b35);
const grassMat = mat(0x557c45);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), grassMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
floor.receiveShadow = true;
scene.add(floor);

// Personaje Yahu: todas las piezas se mantienen dentro de un mismo grupo.
const yahu = new THREE.Group();
function addPart(geometry, material, position, scale) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  if (scale) mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  yahu.add(mesh);
  return mesh;
}
addPart(new THREE.SphereGeometry(0.6, 10, 8), white, [0, 0.5, 0]);
addPart(new THREE.SphereGeometry(0.12, 8, 6), purple, [-0.25, 0.55, -0.48]);
addPart(new THREE.SphereGeometry(0.12, 8, 6), purple, [0.25, 0.55, -0.48]);
addPart(new THREE.SphereGeometry(0.3, 10, 8), darkPink, [0, -0.3, 0.03]);
addPart(new THREE.ConeGeometry(0.15, 0.6, 6), pink, [-0.4, 1.2, 0]);
addPart(new THREE.ConeGeometry(0.15, 0.6, 6), pink, [0.4, 1.2, 0]);
addPart(new THREE.SphereGeometry(0.25, 8, 6), pink, [-0.8, 0.8, 0], [1.5, 1, 0.5]);
addPart(new THREE.SphereGeometry(0.25, 8, 6), pink, [0.8, 0.8, 0], [1.5, 1, 0.5]);
addPart(new THREE.SphereGeometry(0.25, 8, 6), pink, [-0.5, -0.4, 0], [1.2, 1, 0.5]);
addPart(new THREE.SphereGeometry(0.25, 8, 6), pink, [0.5, -0.4, 0], [1.2, 1, 0.5]);
yahu.position.set(0, 0, 4);
scene.add(yahu);

// Árboles del bosque
function createTree(x, z, size = 1) {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22 * size, 0.32 * size, 1.8 * size, 7),
    trunkMat
  );
  trunk.position.y = -0.1 + 0.9 * size;
  trunk.castShadow = true;
  group.add(trunk);

  const crown1 = new THREE.Mesh(new THREE.SphereGeometry(1.15 * size, 8, 7), leaf1);
  crown1.position.y = 2.0 * size;
  crown1.castShadow = true;
  group.add(crown1);

  const crown2 = new THREE.Mesh(new THREE.SphereGeometry(0.82 * size, 8, 7), leaf2);
  crown2.position.set(0.48 * size, 2.45 * size, 0.05);
  crown2.castShadow = true;
  group.add(crown2);

  group.position.set(x, -1, z);
  scene.add(group);
}
createTree(-3.1, 7.5, 1.25);
createTree(3.1, 7.8, 1.35);
createTree(-5.0, 11, 1.7);
createTree(5.0, 11, 1.65);
createTree(0, 14, 2.0);
createTree(-7, 16, 2.0);
createTree(7, 16, 2.0);

// Arbustos pequeños para dar profundidad al bosque
for (let i = 0; i < 18; i++) {
  const x = (i % 6 - 2.5) * 2.2;
  const z = 6 + Math.floor(i / 6) * 3.2;
  const bush = new THREE.Mesh(new THREE.SphereGeometry(0.65, 7, 6), i % 2 ? leaf1 : leaf2);
  bush.position.set(x, -0.55, z);
  bush.scale.set(1.4, 0.8, 0.9);
  bush.castShadow = true;
  scene.add(bush);
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
